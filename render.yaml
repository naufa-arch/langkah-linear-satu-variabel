# Konfigurasi hosting Render (Blueprint). Satu layanan: FastAPI menyajikan API + frontend.
# Panduan: docs/DEPLOY.md
services:
  - type: web
    name: langkah-linear
    runtime: python
    plan: free
    region: singapore
    buildCommand: cd backend && pip install uv && uv sync --frozen --no-dev
    # migrasi basis data dijalankan otomatis saat server menyala (app/main.py)
    startCommand: cd backend && uv run --frozen --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # pakai Python bawaan Render, jangan unduh Python lain saat build
      - key: UV_PYTHON_DOWNLOADS
        value: never
      - key: ENVIRONMENT
        value: production
      # Rahasia: isi nilainya di dasbor Render (Environment), JANGAN di berkas ini.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEARCHER_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # WAJIB PostgreSQL (Neon/Supabase gratis). Disk Render gratis tidak permanen, jadi SQLite akan hilang.
      - key: DATABASE_URL
        sync: false
